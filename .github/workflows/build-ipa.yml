name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài dependencies và khởi tạo project iOS
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Thêm quyền Camera và Định vị vào Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Ứng dụng cần quyền truy cập camera để xem trước và chụp ảnh.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Ứng dụng cần quyền định vị để gắn tọa độ GPS lên ảnh khi được bật.'" "$PLIST" || true

      - name: Archive project iOS (không ký tự động)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Đóng gói thư mục .app thành file .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa_out/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa_out/Payload/"
          cd "$RUNNER_TEMP/ipa_out"
          zip -r CamTienIch.ipa Payload

      - name: Tải file .ipa lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamTienIch-iOS-IPA
          path: ${{ runner.temp }}/ipa_out/CamTienIch.ipa
